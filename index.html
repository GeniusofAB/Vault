<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault — каталог модов Dota 2</title>
  <meta name="description" content="Каталог косметических модов для Dota 2: шрифты, иконки, HUD, вардены, курьеры, эффекты и звуки.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header-container">
    <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Меню">
      <span class="material-symbols-rounded">menu</span>
    </button>
    
    <div class="logo">
      <span class="logo-text">Vault <span class="emoji">😊</span></span>
    </div>
    
    <div class="search-wrapper">
      <div class="search-box">
        <span class="material-symbols-rounded search-icon">search</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Поиск..." autocomplete="off">
        <button class="search-clear" id="searchClear" style="display: none;" aria-label="Очистить">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
    </div>
    
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Тема">
        <span class="material-symbols-rounded" id="themeIcon">light_mode</span>
      </button>
      <button class="cart-btn" id="cartBtn" aria-label="Корзина">
        <span class="material-symbols-rounded">shopping_bag</span>
        <span class="cart-badge" id="cartBadge">0</span>
      </button>
    </div>
  </div>
</header>

<div class="container-main">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>Категории</h3>
      <button class="sidebar-close" id="sidebarClose" aria-label="Закрыть">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
    <div class="category-list" id="categoryList"></div>
  </aside>
  
  <div class="overlay" id="overlay"></div>
  
  <main class="main">
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="stats-line" id="statsLine"></span>
      </div>
      <div class="toolbar-right">
        <label class="sort-field">
          <span class="material-symbols-rounded">sort</span>
          <select id="sortSelect">
            <option value="new">Новые</option>
            <option value="old">Старые</option>
            <option value="az">A → Я</option>
            <option value="za">Я → A</option>
          </select>
        </label>
      </div>
    </div>
    
    <div class="grid" id="grid"></div>
    
    <div class="empty-state" id="emptyState" hidden>
      <span class="material-symbols-rounded">search_off</span>
      <p>Ничего не найдено</p>
      <button class="btn-primary" id="resetFilters" type="button">Сбросить фильтры</button>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modalClose" aria-label="Закрыть">
      <span class="material-symbols-rounded">close</span>
    </button>
    
    <div class="modal-cover" id="modalCover">
      <span class="material-symbols-rounded modal-icon" id="modalIcon"></span>
    </div>
    
    <div class="modal-body">
      <span class="modal-category" id="modalCategory"></span>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-author" id="modalAuthor"></p>
      <div class="modal-tags" id="modalTags"></div>
      <p class="modal-desc" id="modalDesc"></p>
      
      <div class="modal-meta">
        <span><span class="material-symbols-rounded icon-small">folder_zip</span><span id="modalSize"></span></span>
        <span><span class="material-symbols-rounded icon-small">calendar_today</span><span id="modalDate"></span></span>
      </div>
      
      <div class="modal-actions">
        <a id="modalDownload" class="btn-primary" href="#" target="_blank" rel="noopener noreferrer" download>
          <span class="material-symbols-rounded">download</span>
          Скачать
        </a>
        <button class="btn-secondary" id="modalAddCart" type="button">
          <span class="material-symbols-rounded">add_shopping_cart</span>
          В корзину
        </button>
      </div>
      
      <div class="modal-extra-downloads" id="extraDownloads"></div>
    </div>
  </div>
</div>

<!-- Cart Modal -->
<div class="cart-overlay" id="cartOverlay" hidden>
  <div class="cart-modal">
    <div class="cart-header">
      <h2>Корзина</h2>
      <button class="cart-modal-close" id="cartModalClose" aria-label="Закрыть">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
    
    <div class="cart-content">
      <div class="cart-empty" id="cartEmpty">
        <span class="material-symbols-rounded">shopping_bag</span>
        <p>Корзина пуста</p>
      </div>
      
      <div class="cart-items-list" id="cartItemsList"></div>
    </div>
    
    <div class="cart-footer" id="cartFooter">
      <button class="btn-secondary" id="cartClearBtn" type="button">
        <span class="material-symbols-rounded">delete</span>
        Очистить
      </button>
      <button class="btn-primary" id="cartDownloadBtn" type="button">
        <span class="material-symbols-rounded">archive</span>
        Скачать все
      </button>
    </div>
  </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
